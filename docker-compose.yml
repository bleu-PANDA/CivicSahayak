version: '3.8'

services:
  # 1. PostgreSQL Relational State Store
  postgres:
    image: postgres:16-alpine
    container_name: civicos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicos_pass}
      POSTGRES_DB: ${POSTGRES_DB:-civicos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicos_user -d civicos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. OpenSearch Scheme & Evidence Knowledge Base
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: civicos-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.neural_search.enabled=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # 3. LocalStack AWS Emulation (S3, Lambda, SecretsManager)
  localstack:
    image: localstack/localstack:latest
    container_name: civicos-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,secretsmanager
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # 4. MinIO S3-Compatible Object Store
  minio:
    image: minio/minio:latest
    container_name: civicos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # 5. CivicOS Backend API & Strands Multi-Agent Orchestrator
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicos-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgres://civicos_user:civicos_pass@postgres:5432/civicos_dev
      - OPENSEARCH_URL=http://opensearch:9200
      - CORRETTO_URL=http://rules-engine:8081
      - S3_ENDPOINT=http://localstack:4566
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock_access_key
      - AWS_SECRET_ACCESS_KEY=mock_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      localstack:
        condition: service_healthy
      minio:
        condition: service_healthy
      rules-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # 6. Amazon Corretto Rules Engine (Java 21 Spring Boot)
  rules-engine:
    build:
      context: ./rules-engine
      dockerfile: Dockerfile
    container_name: civicos-rules-engine
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || curl -f http://localhost:8081/api/evaluate-eligibility -H 'Content-Type: application/json' -d '{}' || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M

  # 7. Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicos-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # 8. Seed Data Loader (runs once on startup)
  seed-data:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicos-seed-data
    command: ["node", "scripts/seed-schemes.js"]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  opensearch_data:
  localstack_data:
  minio_data:

