# CivicOS Corretto Rules Engine Configuration
server.port=${SERVER_PORT:8081}
spring.application.name=civicos-rules-engine

# Actuator health endpoint for Docker healthchecks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Info endpoint metadata
info.app.name=CivicOS Corretto Rules Engine
info.app.version=1.0.0
info.app.runtime=Amazon Corretto JDK 21
info.app.description=Deterministic Government Benefits Eligibility Rules Evaluator
